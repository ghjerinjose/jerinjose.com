  <meta charset="UTF-8" />

  <title>Jerin Jose</title>
  <style>
    :root { --bg:#000; --fg:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      height:100%;
      background:var(--bg);
      color:var(--fg);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      overflow:hidden;
      touch-action:none;
    }
    .stage {
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:12vh 24px 22px;
      transition:filter 180ms ease;
    }
    .stage.blur { filter:blur(8px); }
    .mark {
      text-align:center;
      letter-spacing:.28em;
      font-weight:500;
      font-size:18px;
      text-transform:uppercase;
    }
    .word {
      margin-top:12px;
      text-align:center;
      letter-spacing:.22em;
      font-size:11px;
      opacity:.8;
      text-transform:uppercase;
    }
    .ring {
      width:72px;
      height:72px;
      border-radius:50%;
      border:6px solid #fff;
      box-shadow: inset 0 0 0 14px #000, inset 0 0 0 20px #fff;
      flex-shrink:0;
    }
    .wheel, .cats, .pet, .adv {
      min-height:72px;
      text-align:center;
      letter-spacing:.16em;
      font-size:11px;
      text-transform:uppercase;
      opacity:.85;
    }
    .wheel div, .cats div { padding:6px 0; opacity:.35; }
    .wheel .on, .cats .on { opacity:1; }
    .pet, .adv {
      width:100%;
      max-width:320px;
    }
    .grid {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
    }
    .adv .grid {
      grid-template-columns:1fr 1fr 1fr 1fr;
      gap:6px;
    }
    .cell {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    .cell img {
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:2px;
      display:block;
      pointer-events:none;
    }
    .cell span {
      letter-spacing:.08em;
      font-size:8px;
      opacity:.55;
      text-transform:uppercase;
    }
    .adv .meta {
      margin-top:10px;
      letter-spacing:.08em;
      font-size:9px;
      opacity:.6;
      text-transform:uppercase;
      line-height:1.8;
    }
    .socials {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:14px;
      max-width:320px;
    }
    .socials a {
      width:16px;
      height:16px;
      display:block;
    }
    .socials svg {
      width:16px;
      height:16px;
      display:block;
    }
    footer {
      margin-top:16px;
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      opacity:.45;
      text-align:center;
    }

  <script>
    const stage = document.getElementById("stage");
    const mark = document.getElementById("mark");
    const word = document.getElementById("word");
    const ring = document.getElementById("ring");
    const wheel = document.getElementById("wheel");
    const cats = document.getElementById("cats");
    const pet = document.getElementById("pet");
    const adv = document.getElementById("adv");
    const wheelItems = [...wheel.querySelectorAll("div")];
    const catItems = [...cats.querySelectorAll("div")];

    let view = "center";
    let startX = 0, startY = 0;
    let wheelI = 1, catI = 0;
    let audio = null;

    function ctx() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audio) audio = new AC();
        if (audio && audio.state === "suspended") audio.resume();
        return audio;
      } catch (e) {
        return null;
      }
    }
    function tone(freq, ms) {
      const c = ctx();
      if (!c) return;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(c.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + ms/1000);
      o.stop(c.currentTime + ms/1000);
    }
    function click() { tone(1800, 30); if (navigator.vibrate) navigator.vibrate([10,10,10,10,10]); }
    function lowClick() { tone(900, 35); if (navigator.vibrate) navigator.vibrate([8,8,8,8,8,8,8]); }
    function tick() { tone(1400, 18); if (navigator.vibrate) navigator.vibrate(8); }

    function blur() {
      stage.classList.add("blur");
      setTimeout(() => stage.classList.remove("blur"), 160);
    }
    function setWheel() {
      wheelItems.forEach((el,i) => el.classList.toggle("on", i === wheelI));
    }
    function setCats() {
      catItems.forEach((el,i) => el.classList.toggle("on", i === catI));
    }
    function open(next) {
      blur();
      if (next === "left" || next === "right" || next === "center") click();
      if (next === "down" || next === "up") lowClick();
      view = next;
      wheel.hidden = next !== "left";
      cats.hidden = next !== "right";
      pet.hidden = next !== "up";
      adv.hidden = next !== "down";
      if (next === "center") { mark.textContent = "JERIN JOSE"; word.textContent = "Exploration"; }
      if (next === "left") { mark.textContent = "OMNIVERSE"; word.textContent = "Expansion"; }
      if (next === "right") { mark.textContent = "AIXI"; word.textContent = "Automation"; }
      if (next === "down") { mark.textContent = "ADVENTURE"; word.textContent = "Agastyamalai"; }
      if (next === "up") { mark.textContent = "NEWTON"; word.textContent = "Companion"; }
    }

    ring.addEventListener("pointerdown", e => {
      ring.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      try { ctx(); } catch (e) {}
    });
    ring.addEventListener("pointerup", e => {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return open("center");
      if (Math.abs(dx) > Math.abs(dy)) return open(dx < 0 ? "left" : "right");
      if (dy > 0) return open(view === "down" ? "center" : "down");
      return open(view === "up" ? "center" : "up");
    });

    wheel.addEventListener("pointerup", e => {
      if (e.clientY < wheel.getBoundingClientRect().top + 36) wheelI = Math.max(0, wheelI-1);
      else wheelI = Math.min(wheelItems.length-1, wheelI+1);
      setWheel(); tick();
    });
    cats.addEventListener("pointerup", e => {
      if (e.clientY < cats.getBoundingClientRect().top + 36) catI = Math.max(0, catI-1);
      else catI = Math.min(catItems.length-1, catI+1);
      setCats(); tick();
    });
  </script>
